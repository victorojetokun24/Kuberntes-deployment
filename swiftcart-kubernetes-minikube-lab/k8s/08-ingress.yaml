apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftcart-ingress
  namespace: swiftcart
spec:
  ingressClassName: nginx
  rules:
    - host: swiftcart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swiftcart-api
                port:
                  number: 80
